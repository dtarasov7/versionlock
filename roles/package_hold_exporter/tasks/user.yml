---
- name: user.yml - Create read-only HTTP system group
  ansible.builtin.group:
    name: "{{ package_hold_exporter_group }}"
    system: true
    state: present
- name: user.yml - Create read-only HTTP system user
  ansible.builtin.user:
    name: "{{ package_hold_exporter_user }}"
    group: "{{ package_hold_exporter_group }}"
    system: true
    create_home: false
    shell: /sbin/nologin
    home: /nonexistent
    password_lock: true
    state: present
