---
# Проверено 2026-10-04 по бинарным индексам x86_64/amd64 и noarch/all:
# РЕД ОС 7.3 standard (os/updates и отмеченные ниже 3rdparty),
# ALT 10 (p10), Astra Linux SE 1.7 (stable main/base/extended/update).
# Источники, варианты и полный список ПО: package_hold_packages.md.
# null: пакет не найден в проверенных индексах; hold для этой ОС пропущен.
# Это не утверждение об отсутствии пакета в сторонних или закрытых репозиториях.
# Prometheus: выбран пакет 2.x; hold сам не проверяет major установленной версии.
# В ALT выбран Kubernetes/CRI 1.28; для 1.25/1.26/1.27 замените суффиксы.
# PostgreSQL: пример серверов РЕД ОС 12 / Astra 11 / ALT 13; другие major — в MD.
# VictoriaMetrics: single-node; OTel Collector: contrib; GitLab: CE.
# Не найдены во всех проверенных ОС: elasticsearch-exporter, Jaeger,
# Data Prepper, Postgres Pro. Их нет в активном списке: all-null запрещён схемой.
# Для этих продуктов требуется отдельная проверка репозитория поставщика.
