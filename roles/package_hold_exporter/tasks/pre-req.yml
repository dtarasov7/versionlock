---
- name: pre-req.yml - Validate lifecycle and safe managed paths
  ansible.builtin.assert:
    that:
      - package_hold_exporter_state in ['present', 'absent']
      - package_hold_packages is defined
      - package_hold_exporter_binary_path is match('^/usr/local/libexec/[A-Za-z0-9_.-]+$')
      - package_hold_exporter_config_path is match('^/etc/package-hold-exporter/[A-Za-z0-9_.-]+$')
      - package_hold_exporter_status_path is match('^/var/lib/package-hold-exporter/[A-Za-z0-9_.-]+$')
      - package_hold_exporter_binary_path | basename not in ['.', '..']
      - package_hold_exporter_config_path | basename not in ['.', '..']
      - package_hold_exporter_status_path | basename not in ['.', '..']
      - package_hold_exporter_python is match('^/[A-Za-z0-9_./-]+$')
      - package_hold_exporter_zabbix_include_dir is match('^/etc/zabbix/[A-Za-z0-9_./-]+$')
      - "'..' not in package_hold_exporter_zabbix_include_dir"
      - package_hold_exporter_user is match('^[a-z_][a-z0-9_-]*$')
      - package_hold_exporter_group is match('^[a-z_][a-z0-9_-]*$')
      - package_hold_exporter_user != 'root'
      - package_hold_exporter_group != 'root'
      - package_hold_exporter_command_timeout_seconds | int > 0
      - package_hold_exporter_command_timeout_seconds | int <= package_hold_exporter_scan_timeout_seconds | int
      - package_hold_exporter_scan_timeout_seconds | int < package_hold_exporter_scan_interval_seconds | int
      - package_hold_exporter_scan_interval_seconds | int >= 60
      - package_hold_exporter_listen_port | int >= 1024
      - package_hold_exporter_listen_port | int <= 65535
- name: pre-req.yml - Identify supported OS without inferring apt family
  package_hold_prerequisite:
    mode: platform
  register: package_hold_exporter_platform
- name: pre-req.yml - Resolve the single inventory
  ansible.builtin.set_fact:
    package_hold_exporter_resolved: "{{ package_hold_packages | package_hold_resolve(ansible_facts.package_hold_platform.id) }}"
- name: pre-req.yml - Check scanner interpreter version
  ansible.builtin.command:
    argv:
      - "{{ package_hold_exporter_python }}"
      - -c
      - 'import sys; sys.exit(0 if sys.version_info >= (3, 8) else 1)'
  changed_when: false
  check_mode: false
  when: package_hold_exporter_state == 'present'
