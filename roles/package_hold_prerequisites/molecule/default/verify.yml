---
- name: Verify native hold behavior
  hosts: all
  gather_facts: false
  vars:
    package_hold_packages:
    - id: bash
      names:
        redos: bash
        astra: bash
        alt: bash
    package_hold_prerequisites_mode: remediate
  tasks:
  - name: Audit final capabilities
    ansible.builtin.include_role:
      name: package_hold_prerequisites
    vars:
      package_hold_prerequisites_mode: audit
  - name: Verify audit made no change
    ansible.builtin.assert:
      that:
      - package_hold_prerequisites_result.success
      - not package_hold_prerequisites_result.changed
